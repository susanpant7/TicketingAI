name: ticketing-ai

services:
  ollama:
    image: ollama/ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Runs once and exits: downloads the default models into the ollama-data volume. Later starts find them already there.
  pull-models:
    image: ollama/ollama
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull qwen2.5:7b && ollama pull nomic-embed-text"]
    restart: "no"

  server:
    build: ./server
    restart: unless-stopped
    # The secrets: Admin__Username, Admin__Password, Jwt__Key and ChatApi__ApiKey, and any other setting, such as
    # AiDefaults__ChatProvider. The .env file is not committed. See .env.example.
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # The starting values of the two Ollama addresses (embeddings, and the chat's Chat API base URL) for a new database: the
      # Ollama container, by its service name, unless .env sets AiDefaults__ChatBaseUrl (for example for Gemini). After that they
      # are changed on the Settings page.
      AiDefaults__OllamaUrl: http://ollama:11434
      AiDefaults__ChatBaseUrl: ${AiDefaults__ChatBaseUrl:-http://ollama:11434}
    depends_on:
      pull-models:
        condition: service_completed_successfully
    # No published port: only the client (nginx) is reachable from outside, and it proxies /api to the server.
    volumes:
      - server-data:/app/data

  client:
    build: ./client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  server-data:
  ollama-data:
