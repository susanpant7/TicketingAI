name: ticketing-ai

services:
  ollama:
    image: ollama/ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Runs once and exits: downloads the default models into the ollama-data volume. Later starts find them already there.
  pull-models:
    image: ollama/ollama
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull qwen2.5:7b && ollama pull nomic-embed-text"]
    restart: "no"

  server:
    build: ./server
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Production does not read appsettings.Development.json, so the secrets come from the .env file (see .env.example).
      Admin__Username: ${ADMIN_USERNAME:-admin}
      Admin__Password: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in the .env file}
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in the .env file (at least 32 characters)}
      # The Ollama container, reached by its service name.
      Ollama__BaseUrl: http://ollama:11434
    depends_on:
      pull-models:
        condition: service_completed_successfully
    # No published port: only the client (nginx) is reachable from outside, and it proxies /api to the server.
    volumes:
      - server-data:/app/data

  client:
    build: ./client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  server-data:
  ollama-data:
