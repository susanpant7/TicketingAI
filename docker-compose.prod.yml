# The backend alone, for a server: the .NET API with its SQLite database, and nothing else. There is no Ollama here, so the chat model
# and the embedding model must be online services (Gemini, Groq, ...), set in the .env file. The client runs somewhere else (Vercel).
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# The API listens on 127.0.0.1:5176 of the server only, so put https in front of it: a Cloudflare Tunnel, or a reverse proxy such as
# Caddy or nginx (see "Deploy the backend on a server" in the README). The database lives in the server-data volume: back it up.
name: ticketing-ai-api

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "127.0.0.1:5176:8080"
    volumes:
      - server-data:/app/data

volumes:
  server-data:
